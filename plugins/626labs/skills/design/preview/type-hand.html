<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;height:100%;background:var(--bg-1);overflow:hidden;padding:20px;box-sizing:border-box;color:var(--fg-1)}
  .quote{font-family:var(--font-hand);font-size:34px;line-height:1.25;margin:0 0 14px;border-top:2px solid var(--brand-cyan);padding-top:12px}
  .bold{font-family:var(--font-hand);font-weight:700;font-size:44px;line-height:1.05;margin:0 0 14px;background:var(--brand-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sign{font-family:var(--font-hand);font-size:28px;margin:0 0 12px;color:var(--fg-2)}
  .meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-muted)}
</style></head><body>
<p class="quote">I build tools, because care doesn't always scale.</p>
<p class="bold">Imagine Something Else.</p>
<p class="sign">&mdash; Este</p>
<div class="meta">EsteFont Pro 400 / 700 &middot; Este's own words only &middot; upright &middot; 1.2x &middot; 24px min</div>
</body></html>
